<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f22" />
    <meta
      name="description"
      content="Pustaka — A premium, private personal reading tracker synced with Firebase Cloud database."
    />
    <link rel="icon" type="image/png" href="/stack-of-books.png" />
    <title>Pustaka</title>
    <!-- Google Fonts Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!-- Redesign fonts. The Kannada faces are unicode-range subsets: the browser downloads them only when Kannada text is on the page. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600&family=Noto+Serif+Kannada:wght@400;600&display=swap" rel="stylesheet">
    <!-- Applies the saved theme before first paint so there is no flash of the default one. -->
    <script>
      try {
        var t = localStorage.getItem("pustaka:theme");
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "catppuccin-mocha" : "pustaka";
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
