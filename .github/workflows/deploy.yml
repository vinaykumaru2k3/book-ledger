name: Deploy to Firebase Hosting

# Every push to the default branch (i.e. every merged PR) is tested, built and
# deployed to the live site. Direct pushes to that branch deploy too.
on:
  push:
    branches: [codex/book-ledger-app]

# Never run two deploys at once; a newer merge replaces a queued older one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional. The repository secret VITE_GOOGLE_BOOKS_API_KEY gives
          # Google Books lookups their own daily quota; empty when unset.
          VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.VITE_GOOGLE_BOOKS_API_KEY }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: book-ledger-2a2e4
          channelId: live

      # Publish the security rules after the site. Runs last on purpose: if the
      # service account lacks the "Firebase Rules Admin" role this step fails
      # visibly, but the site above has already been deployed.
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project book-ledger-2a2e4
          rm -f "$RUNNER_TEMP/firebase-sa.json"
